<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ComicCraft</title>

    <link rel="stylesheet"
          href="{{ url_for('static', path='style.css') }}">
</head>

<body>

<header>
    <h1>🎨 ComicCraft</h1>
    <p>AI Comic Story Creator</p>
</header>


<main>

    <section class="hero">

        <h2>Create Your AI Comic</h2>

        <p>
            Enter your story and generate a five-panel AI comic.
        </p>

    </section>


    <section class="form-box">

        <form action="/generate" method="post">

            <label>Story Idea</label>

            <textarea
                name="story_prompt"
                rows="5"
                placeholder="Example: A student discovers a magical book..."
                required></textarea>


            <label>Character Name</label>

            <input
                type="text"
                name="character_name"
                placeholder="Alex"
                required>


            <label>Setting</label>

            <input
                type="text"
                name="setting"
                placeholder="Enchanted forest"
                required>


            <label>Story Tone</label>

            <select name="tone">

                <option value="dramatic">
                    Dramatic
                </option>

                <option value="funny">
                    Funny
                </option>

                <option value="adventurous">
                    Adventurous
                </option>

                <option value="mysterious">
                    Mysterious
                </option>

            </select>


            <label>Art Style</label>

            <select name="art_style">

                <option value="comic book">
                    Comic Book
                </option>

                <option value="manga">
                    Manga
                </option>

                <option value="digital art">
                    Digital Art
                </option>

                <option value="cinematic">
                    Cinematic
                </option>

            </select>


            <button type="submit">
                🚀 Generate Comic
            </button>

        </form>

    </section>

</main>

</body>
</html>
