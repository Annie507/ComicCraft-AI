<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}ComicCraft{% endblock %}
    </title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', path='style.css') }}"
</head>

<body>

    <header class="site-header">
        <div class="container">
            <h1>🎨 ComicCraft</h1>
            <p>AI Comic Story Creator</p>
        </div>
    </header>

    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <p>ComicCraft • AI Comic Story Creator</p>
    </footer>

</body>
</html>
